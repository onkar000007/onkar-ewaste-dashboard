<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found | Onkar Shelke Assignment Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #060d1b;
  --bg-card: #0d1527;
  --card-border: #1a2744;
  --primary: #3b82f6;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background-image: 
    radial-gradient(at 10% 10%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
    radial-gradient(at 90% 20%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
    radial-gradient(at 50% 80%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
}
.error-card {
  max-width: 520px;
  width: 100%;
  background: rgba(13, 21, 39, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
}
.badge {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: #f43f5e;
  background: rgba(244, 63, 94, 0.15);
  border: 1px solid rgba(244, 63, 94, 0.3);
  padding: 4px 14px;
  border-radius: 9999px;
  margin-bottom: 20px;
}
h1 {
  font-size: 56px;
  font-weight: 800;
  background: linear-gradient(135deg, #f43f5e, #fb7185, #fda4af);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
  line-height: 1;
}
h2 {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}
p {
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.6;
  margin-bottom: 28px;
}
.btn-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  padding: 12px 24px;
  border-radius: 12px;
  border: 1px solid rgba(96, 165, 250, 0.4);
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-home:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
}
</style>
</head>
<body>
<div class="error-card">
  <div class="badge">HTTP 404</div>
  <h1>404</h1>
  <h2>Page or Document Not Found</h2>
  <p>The requested file or route doesn't exist on this server. All assignments and verified submissions are hosted on the main dashboard.</p>
  <a href="/" class="btn-home">
    <span>← Return to Assignment Dashboard</span>
  </a>
</div>
</body>
</html>
